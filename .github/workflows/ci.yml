name: Validate sanitized portfolio archive

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce archive safety boundary
        run: python scripts/security_scan.py

      - name: Verify synthetic data workflow
        run: python scripts/verify_demo.py
